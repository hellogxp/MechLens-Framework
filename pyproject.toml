[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layerwise-readout-audit"
version = "0.1.0"
description = "Reproducibility artifact for auditing layerwise vocabulary readout"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "datasets>=2.19",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pyarrow>=15",
  "torch>=2.2",
  "transformers==4.48.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

